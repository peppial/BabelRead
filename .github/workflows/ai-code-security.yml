name: AI code security

# Manually-run, whole-repo security gate for AI-generated code.
#
# The chain is deliberately the full one, in order, one job per stage, so the Actions graph
# reads as the pipeline itself:
#
#   SAST -> dependency scanning -> secret scanning -> tests -> security tests -> human review
#
# The repository is private, so GitHub Advanced Security is unavailable: CodeQL, Dependency
# Review and SARIF upload to the Security tab would all fail. Every stage therefore uses OSS
# tooling and reports through the job summary plus an artifact.
#
# Each scan job writes findings/<stage>.json; the report job aggregates them and applies the
# fail policy in one place (scripts/security-report.py).

on:
  workflow_dispatch:
    inputs:
      fail_on:
        description: "What fails the run"
        type: choice
        default: high
        options: [high, any, none]
      deep_history:
        description: "Scan the full git history for secrets (slower, finds deleted commits)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ai-code-security-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # ── Stage 1 ─────────────────────────────────────────────────────────────────────
  sast:
    name: 1 · SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Compiler and analyser gate
        id: build
        run: |
          set -o pipefail   # without this, `| tee` masks a failing build
          mkdir -p findings
          # The repo already treats warnings as errors and enables the .NET analysers; that is
          # the cheapest static analysis available and it runs first.
          if dotnet build -warnaserror 2>&1 | tee build.log; then
            echo "build=pass" >> "$GITHUB_OUTPUT"
          else
            echo "build=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Semgrep OSS
        id: semgrep
        run: |
          python3 -m pip install --quiet --disable-pip-version-check semgrep
          # p/github-actions is not decoration: an unpinned or injectable workflow step is one of
          # the most common things an agent writes, and this file is in scope for its own scan.
          semgrep scan \
            --config p/csharp \
            --config p/security-audit \
            --config p/secrets \
            --config p/github-actions \
            --exclude '*.lock.yml' \
            --metrics off \
            --json --output semgrep.json \
            --quiet || true
          test -s semgrep.json

      - name: Record verdict
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          results = []
          try:
              results = json.loads(pathlib.Path("semgrep.json").read_text())["results"]
          except Exception:
              pass
          sev = lambda r: r.get("extra", {}).get("severity", "INFO")
          high = [r for r in results if sev(r) == "ERROR"]
          medium = [r for r in results if sev(r) == "WARNING"]
          build_failed = "${{ steps.build.outputs.build }}" == "fail"
          detail = lambda r: (f"`{r['path']}:{r['start']['line']}` [{r.get('check_id','?').split('.')[-1]}] "
                              f"— {r['extra'].get('message','').splitlines()[0]}")
          status = "fail" if (high or build_failed) else "pass"
          summary = "build failed (warnings are errors)" if build_failed else (
              f"{len(high)} error-severity, {len(medium)} warning-severity" if results else "clean")
          pathlib.Path("findings").mkdir(exist_ok=True)
          pathlib.Path("findings/sast.json").write_text(json.dumps({
              "stage": "sast", "status": status, "high": len(high), "medium": len(medium),
              "summary": summary,
              "details": ([ "`dotnet build -warnaserror` failed — see the build step" ] if build_failed else [])
                         + [detail(r) for r in high + medium],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: findings-sast
          path: findings/
          if-no-files-found: error

  # ── Stage 2 ─────────────────────────────────────────────────────────────────────
  dependencies:
    name: 2 · Dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Known vulnerabilities and deprecations
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive --format json > vulnerable.json || true
          dotnet list package --deprecated --include-transitive --format json > deprecated.json || true

      - name: Package identity
        id: identity
        # Answers the question a vulnerability database cannot: is this dependency the package it
        # claims to be? An AI-suggested id that a squatter already owns carries no advisory.
        run: |
          mkdir -p findings
          python3 scripts/check-package-identity.py \
            --format table --out findings/package-identity.json --no-fail | tee identity.md

      - name: Record verdict
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib

          def load(name):
              try:
                  return json.loads(pathlib.Path(name).read_text())
              except Exception:
                  return {}

          RANK = {"Critical": 3, "High": 3, "Moderate": 2, "Low": 1}
          high, medium, details = [], [], []

          for project in load("vulnerable.json").get("projects", []):
              for fw in project.get("frameworks") or []:
                  for kind in ("topLevelPackages", "transitivePackages"):
                      for pkg in fw.get(kind) or []:
                          for v in pkg.get("vulnerabilities") or []:
                              line = (f"`{pkg['id']}` {pkg.get('resolvedVersion','')} — "
                                      f"{v.get('severity')} · {v.get('advisoryurl','')}")
                              (high if RANK.get(v.get("severity"), 0) >= 3 else medium).append(line)
                              details.append(line)

          for project in load("deprecated.json").get("projects", []):
              for fw in project.get("frameworks") or []:
                  for pkg in fw.get("topLevelPackages") or []:
                      line = f"`{pkg['id']}` is deprecated ({', '.join(pkg.get('deprecationReasons', []))})"
                      medium.append(line); details.append(line)

          identity = load("findings/package-identity.json")
          blocking = identity.get("blocking", [])
          for f in identity.get("findings", []):
              if f["verdict"] == "OK":
                  continue
              line = f"`{f['package']}` — identity {f['verdict']} (score {f['score']}): " + "; ".join(f["signals"])
              if f.get("likely_intended"):
                  line += f" — likely intended: `{f['likely_intended']}`"
              details.append(line)
              (high if f["package"] in blocking else medium).append(line)

          pathlib.Path("findings/dependencies.json").write_text(json.dumps({
              "stage": "dependencies", "status": "fail" if high else "pass",
              "high": len(high), "medium": len(medium),
              "summary": f"{len(high)} blocking, {len(medium)} advisory" if details else "clean",
              "details": details,
          }, indent=2))
          PY
          rm -f findings/package-identity.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: findings-dependencies
          path: findings/
          if-no-files-found: error

  # ── Stage 3 ─────────────────────────────────────────────────────────────────────
  secrets:
    name: 3 · Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: a key deleted in a later commit is still a leaked key.
          fetch-depth: ${{ inputs.deep_history && 0 || 1 }}
          persist-credentials: false

      - name: TruffleHog
        # Pinned by image digest, not a tag. A mutable reference in a security workflow is exactly
        # the supply-chain hole this workflow exists to catch.
        #
        # Verified hits are live credentials and block the run. Unknown hits are advisory: they are
        # what a human has to look at, and they false-positive too often to gate on.
        run: |
          mkdir -p findings
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog@sha256:deb2af10659a488a14d262a323addcde099d99827a1cf1dc4e93c17915c39f08 \
            git file:///repo --results=verified,unknown --json --no-update \
            > trufflehog.jsonl 2>trufflehog.err || true
          tail -5 trufflehog.err || true

      - name: Record verdict
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          verified, unknown = [], []
          for line in pathlib.Path("trufflehog.jsonl").read_text().splitlines() if pathlib.Path("trufflehog.jsonl").exists() else []:
              try:
                  f = json.loads(line)
              except json.JSONDecodeError:
                  continue
              meta = (f.get("SourceMetadata") or {}).get("Data", {}).get("Git", {})
              where = f"`{meta.get('file','?')}` @ {str(meta.get('commit',''))[:8]} — {f.get('DetectorName','?')}"
              (verified if f.get("Verified") else unknown).append(where)
          pathlib.Path("findings/secrets.json").write_text(json.dumps({
              "stage": "secrets", "status": "fail" if verified else "pass",
              "high": len(verified), "medium": len(unknown),
              "summary": f"{len(verified)} verified, {len(unknown)} unverified"
                         if (verified or unknown) else "no secrets found",
              "details": [f"**VERIFIED** {v}" for v in verified] + unknown,
          }, indent=2))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: findings-secrets
          path: findings/
          if-no-files-found: error

  # ── Stage 4 ─────────────────────────────────────────────────────────────────────
  tests:
    name: 4 · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: dotnet test
        id: run
        run: |
          set -o pipefail   # without this, `| tee` masks a failing test run
          mkdir -p findings
          # No LogFileName: four test projects share one --results-directory, and a fixed name makes
          # them overwrite each other so the stage reports the last project only.
          dotnet test --logger trx --results-directory trx 2>&1 | tee test.log

      - name: Record verdict
        if: always()
        run: |
          python3 scripts/summarize-trx.py --trx trx --stage tests --out findings/tests.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: findings-tests
          path: findings/
          if-no-files-found: error

  # ── Stage 5 ─────────────────────────────────────────────────────────────────────
  security-tests:
    name: 5 · Security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Abuse-case suite
        # The tests under tests/BabelRead.Core.Tests/Security cover what this app is actually
        # exposed to: untrusted PDFs and EPUBs, a stored API key, and a model prompt built from
        # attacker-controlled text.
        run: |
          set -o pipefail   # without this, `| tee` masks a failing test run
          mkdir -p findings
          dotnet test tests/BabelRead.Core.Tests \
            --filter "Category=Security" \
            --logger trx --results-directory trx 2>&1 | tee sectest.log

      - name: Fail if the suite is empty
        if: always()
        run: |
          # A filter that matches nothing passes silently. An empty security stage must not read
          # as a green one.
          grep -qE "Passed: +[1-9]" sectest.log || {
            echo "::error::the Category=Security filter matched no tests"; exit 1; }

      - name: Record verdict
        if: always()
        run: |
          python3 scripts/summarize-trx.py --trx trx --stage security-tests --out findings/security-tests.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: findings-security-tests
          path: findings/
          if-no-files-found: error

  # ── Consolidated report ─────────────────────────────────────────────────────────
  report:
    name: 6 · Report
    runs-on: ubuntu-latest
    needs: [sast, dependencies, secrets, tests, security-tests]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: findings
          pattern: findings-*
          merge-multiple: true

      - name: Render
        env:
          # BUG C: `${{ }}` interpolated straight into a run: script is a script-injection sink.
          # Constrained to a choice input here, but the pattern is the one p/github-actions flags
          # and this workflow has no business shipping it.
          FAIL_ON: ${{ inputs.fail_on }}
        run: |
          set -o pipefail
          python3 scripts/security-report.py \
            --findings findings \
            --fail-on "$FAIL_ON" \
            --out security-report.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-report
          path: |
            security-report.md
            findings/
          if-no-files-found: warn

  # ── Stage 7 ─────────────────────────────────────────────────────────────────────
  human-review:
    name: 7 · Human review
    runs-on: ubuntu-latest
    needs: [report]
    if: always()
    # Required-reviewer protection rules on a private repo need GitHub Pro/Team or above. On the
    # Free plan this environment exists but does not block, so the job still publishes the review
    # packet and the gate is advisory. Add a required reviewer to `security-review` in
    # Settings -> Environments to make it a real gate.
    environment: security-review
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-report

      - name: Publish the review packet
        run: |
          {
            echo "## 👤 Human review"
            echo
            if [ "${{ needs.report.result }}" = "success" ]; then
              echo "The automated stages found nothing blocking. A reviewer still has to read the"
              echo "advisory findings below — scanners do not read intent, and AI-generated code"
              echo "fails most often on things that are individually legal."
            else
              echo "**The automated stages found blocking issues.** Do not approve a deploy from this run."
            fi
            echo
            echo "### Reviewer checklist"
            echo
            echo "- [ ] Every new dependency is one a person chose, not one a model suggested"
            echo "- [ ] Untrusted input (PDF/EPUB content, hrefs, language codes) is still treated as untrusted"
            echo "- [ ] Nothing new writes a path derived from a document id without containment"
            echo "- [ ] The API key still reaches only the secret store and an https (or loopback) endpoint"
            echo "- [ ] New tests actually assert behaviour, not just that a call returns"
            echo
            cat security-report.md
          } >> "$GITHUB_STEP_SUMMARY"
